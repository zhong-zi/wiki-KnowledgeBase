# ============================================================
# Docmost 自建版：一条命令从源码构建并启动整套系统
#
#   docker compose -f docker-compose.deploy.yml up -d --build
#
# 与 docker-compose.deps.yml 的区别：
#   - deps 版只起 PostgreSQL / Redis / Gotenberg，应用在宿主机上用 pnpm 跑（Windows 开发用）
#   - 本文件连应用一起容器化，服务器上不需要装 Node / pnpm（部署用）
# ============================================================

services:
  docmost:
    build:
      context: .
      dockerfile: Dockerfile
    image: docmost-local:0.97.0
    container_name: docmost-app
    restart: unless-stopped
    env_file:
      - .env.server
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - docmost_storage:/app/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  db:
    image: pgvector/pgvector:pg18
    container_name: docmost-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docmost_db_2026
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docmost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8
    container_name: docmost-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: docmost-gotenberg
    restart: unless-stopped

volumes:
  docmost_storage:
  db_data:
  redis_data:
